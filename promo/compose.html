<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Battle in Time: promo compositor</title>
<!-- Renders one frame of the 20-second promo at a time: window.renderFrame(n) draws frame n (30 fps) into the canvas.
     render.py screenshots each frame and ffmpeg joins them to the music. Footage comes from capture.py (?base=...). -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600;700&family=Nunito:wght@700;800&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=block" rel="stylesheet">
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ?v=1 lays the same edit out for a 9:16 phone screen (1080x1920). The footage itself is always 1920x1080 (FW x FH).
const Q = new URLSearchParams(location.search), V = Q.get('v') === '1';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080, FW = 1920, FH = 1080, FPS = 30;
const cv = document.getElementById('c'), g = cv.getContext('2d');
cv.width = W; cv.height = H;
const BASE = Q.get('base') || '../footage/';
const PIX = '"Press Start 2P", monospace', FRED = '"Fredoka", sans-serif', NUN = '"Nunito", sans-serif', FELL = '"IM Fell English", serif', FELLSC = '"IM Fell English SC", serif';
const GOLD = '#ffd84a', GOLD_DK = '#9a7a10', INK = '#0b080c', PLUM = '#2d2438', CREAM = '#e8d8a0';

// ---------------- the cut list (seconds) ----------------
// The music (music.py) hits on 5.0 (braam), 8.0 (the drop), 15.0 (the title) and whooshes at the time jumps.
const CUT = {
  hook: 0, silas: 1.6, dorothy: 5.0, heirloom: 6.9, chase: 8.0, jump: 9.6, finale: 12.0, title: 15.0, end: 20.0,
};
// Where each shot starts in its footage (frame numbers in footage/<clip>/), and how fast it plays.
const SRC = {
  silas: { clip: 'silas_erase', at: 0, n: 125 },
  dorothy: { clip: 'dorothy', at: 0, n: 80 },
  heirloom: { clip: 'chase', at: 0, n: 240 },
  chase: { clip: 'chase3', at: 0, n: 180 },   // the ram: good for its first 36 frames, before the Heirloom is boxed in
  jump: { clip: 'jump', at: 0, n: 150 },
  finale: { clip: 'finale', at: 60, n: 241 },   // Engine No. 1 hops at footage frames 90, 110, 149 and 169
  portrait: { clip: 'silas_out', at: 60 },
};
const FINALE_YEARS = [];   // filled by render.py from the capture log, if known

// ---------------- little helpers ----------------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = { out: k => 1 - Math.pow(1 - clamp(k), 3), in: k => Math.pow(clamp(k), 3), io: k => { k = clamp(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; },
  back: k => { k = clamp(k); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); } };
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const span = (t, a, b) => clamp((t - a) / (b - a));

const cache = new Map();
function frame(clip, i) {
  const key = `${clip}/${String(Math.max(0, i)).padStart(5, '0')}.jpg`;
  if (!cache.has(key)) {
    const im = new Image(); im.src = BASE + key;
    cache.set(key, im.decode().then(() => im, () => null));
    if (cache.size > 60) cache.delete(cache.keys().next().value);
  }
  return cache.get(key);
}
async function src(name, u, rate = 1) {
  const s = SRC[name];
  return frame(s.clip, Math.min(s.n - 1, s.at + Math.floor(u * FPS * rate)));
}

// film grain, made once
const grains = [...Array(6)].map((_, k) => {
  const c = document.createElement('canvas'); c.width = 480; c.height = 270;
  const x = c.getContext('2d'), d = x.createImageData(480, 270);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (hash(i * 0.37 + k * 999) - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return c;
});
function grain(f, a = 0.07) {
  g.save(); g.globalAlpha = a; g.globalCompositeOperation = 'overlay'; g.imageSmoothingEnabled = false;
  const th = W * 270 / 480;   // tiled down the frame, so the grain keeps its shape on a tall screen
  for (let y = 0; y < H; y += th) g.drawImage(grains[(f + Math.round(y)) % 6], 0, y, W, th);
  g.restore();
}
function vignette(a = 0.55, col = '0,0,0') {
  const D = Math.hypot(W, H) / 2;
  const r = g.createRadialGradient(W / 2, H / 2, D * 0.34, W / 2, H / 2, D * 1.03);
  r.addColorStop(0, `rgba(${col},0)`); r.addColorStop(1, `rgba(${col},${a})`);
  g.fillStyle = r; g.fillRect(0, 0, W, H);
}
function flash(a, col = '255,255,255') { if (a > 0.003) { g.fillStyle = `rgba(${col},${clamp(a)})`; g.fillRect(0, 0, W, H); } }

/** Footage, scaled about (cx, cy) in footage pixels, with a colour grade and an optional shake and RGB split.
 *  On the tall screen the footage first covers the frame, then `vzoom` (or a gentler version of `zoom`) pushes in. */
function shot(im, { zoom = 1, vzoom, cx = FW / 2, cy = FH / 2, filter = 'none', shake = 0, t = 0, split = 0, rot = 0, mask = false } = {}) {
  if (!im) { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); return; }
  const base = Math.max(W / FW, H / FH), S = base * (V ? (vzoom ?? 1 + (zoom - 1) * 0.35) : zoom);
  const sx = shake ? (hash(t * 91) - 0.5) * shake : 0, sy = shake ? (hash(t * 57 + 3) - 0.5) * shake : 0;
  // keep the frame covered: the centre can only wander as far as the zoom allows (with a margin for shake and tilt)
  const zz = S / (1 + Math.abs(rot) * 2.2 + (shake ? shake / 900 : 0)), hw = W / (2 * zz), hh = H / (2 * zz);
  cx = hw >= FW / 2 ? FW / 2 : clamp(cx, hw, FW - hw);
  cy = hh >= FH / 2 ? FH / 2 : clamp(cy, hh, FH - hh);
  g.save();
  g.translate(W / 2 + sx, H / 2 + sy); g.rotate(rot); g.scale(S, S); g.translate(-cx, -cy);
  if (S * (1 - Math.abs(rot)) < base * 1.02 || shake) { g.fillStyle = '#000'; g.fillRect(-200, -200, FW + 400, FH + 400); }
  g.filter = filter;
  g.drawImage(im, 0, 0, FW, FH);
  if (mask) { g.filter = 'none'; g.fillStyle = INK; g.fillRect(1660, 990, 260, 60); g.filter = filter; }   // the game's "E: go on" hint
  if (split > 0.5) {
    g.globalCompositeOperation = 'screen'; g.globalAlpha = 0.5;
    g.filter = filter + ' sepia(1) saturate(6) hue-rotate(-50deg)'; g.drawImage(im, -split, 0, FW, FH);
    g.filter = filter + ' sepia(1) saturate(6) hue-rotate(150deg)'; g.drawImage(im, split, 0, FW, FH);
  }
  g.restore();
}
/** Tall screen only: the speaker's portrait from the cut scene, lifted out of the footage and blown up (pixels kept
 *  hard), over a soft, dark copy of the map. punch zooms into the face. The game's own dialogue box is redrawn larger. */
const PORTRAIT = [4, 278, 472, 502];   // the portrait inside its frame, in footage pixels
function portraitScene(im, { filter, punch = 0, shake = 0, split = 0, t }) {
  shot(im, { vzoom: 1.2, cx: 960, cy: 380, filter: filter + ' blur(12px) brightness(0.45)' });
  if (!im) return;
  const [px, py, pw, ph] = PORTRAIT, k = 1.72 * (1 + 0.75 * punch);
  const sx = shake ? (hash(t * 91) - 0.5) * shake : 0, sy = shake ? (hash(t * 57 + 3) - 0.5) * shake : 0;
  const cx = W / 2 + sx, cy = 745 + 120 * punch + sy, w = pw * k, h = ph * k, x = cx - w / 2, y = cy - h / 2;
  g.save(); g.imageSmoothingEnabled = false;
  g.shadowColor = 'rgba(0,0,0,0.7)'; g.shadowBlur = 40; g.shadowOffsetY = 14; g.fillStyle = '#000'; g.fillRect(x, y, w, h); g.shadowColor = 'transparent';
  g.filter = filter; g.drawImage(im, px, py, pw, ph, x, y, w, h);
  if (split > 0.5) {
    g.globalCompositeOperation = 'screen'; g.globalAlpha = 0.5;
    g.filter = filter + ' sepia(1) saturate(6) hue-rotate(-50deg)'; g.drawImage(im, px, py, pw, ph, x - split, y, w, h);
    g.filter = filter + ' sepia(1) saturate(6) hue-rotate(150deg)'; g.drawImage(im, px, py, pw, ph, x + split, y, w, h);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  }
  g.filter = 'none'; g.lineWidth = 8; g.strokeStyle = CREAM; g.strokeRect(x, y, w, h);
  g.restore();
}
/** Horizontal tearing: slices of what is already on the canvas shoved sideways. */
function tear(amount, seed) {
  if (amount <= 0) return;
  const snap = document.createElement('canvas'); snap.width = W; snap.height = H; snap.getContext('2d').drawImage(cv, 0, 0);
  for (let i = 0; i < 14; i++) {
    const y = Math.floor(hash(seed * 13 + i) * H), h = 8 + hash(seed * 7 + i * 3) * 70, dx = (hash(seed * 3 + i * 11) - 0.5) * 2 * amount;
    g.drawImage(snap, 0, y, W, h, dx, y, W, h);
  }
}

/** The game's banner lettering: pixel font, black outline, hard drop shadow. */
function pix(text, x, y, size, { color = '#fff', align = 'center', alpha = 1, scale = 1, shadow = true, spacing = 0, outline = true, base = 'middle' } = {}) {
  if (alpha <= 0.002) return;
  g.save(); g.globalAlpha = alpha; g.translate(x, y); g.scale(scale, scale);
  g.font = `${size}px ${PIX}`; g.textAlign = align; g.textBaseline = base;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
  const s = Math.max(2, size * 0.09);
  if (shadow) { g.fillStyle = '#000'; g.fillText(text, s * 1.4, s * 1.4); }
  if (outline) { g.lineJoin = 'round'; g.lineWidth = s * 1.6; g.strokeStyle = '#000'; g.strokeText(text, 0, 0); }
  g.fillStyle = color; g.fillText(text, 0, 0);
  g.restore();
}
/** Slammed in: drops from big to size with a small overshoot. */
function slam(text, x, y, size, t, t0, opts = {}) {
  const k = span(t, t0, t0 + 0.16);
  if (t < t0) return;
  const out = opts.until ? span(t, opts.until - 0.1, opts.until) : 0;
  pix(text, x, y, size, { ...opts, scale: lerp(1.9, 1, ease.out(k)) * (1 + 0.15 * out), alpha: k * (1 - out) * (opts.alpha ?? 1) });
}
/** Typed out a character at a time. */
function typed(text, t, t0, cps = 40) { return text.slice(0, Math.max(0, Math.floor((t - t0) * cps))); }

function dialogueCard(t, t0, t1, who, sub, text, face) {
  // the game's own dialogue box, drawn larger
  const k = ease.back(span(t, t0, t0 + 0.28)), out = span(t, t1 - 0.15, t1);
  if (t < t0 || t > t1) return;
  // on the tall screen the box is bigger type, sits above the apps' caption area, and loses the face if the portrait is already up
  const L = V ? { w: 1000, h: face ? 330 : 270, y: face ? 1195 : 1215, fs: 190, who: 38, sub: 24, txt: 46, lh: 58, head: 70, body: 128 }
              : { w: 1180, h: 210, y: H - 280, fs: 170, who: 32, sub: 22, txt: 38, lh: 48, head: 62, body: 112 };
  const w = L.w, h = L.h, x = (W - w) / 2, y = L.y + (1 - k) * 260 + out * 260, tx = face ? x + L.fs + 46 : x + 44;
  g.save(); g.globalAlpha = 1 - out;
  g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 30; g.shadowOffsetY = 10;
  g.fillStyle = 'rgba(14,16,24,0.96)'; round(x, y, w, h, 18); g.fill();
  g.shadowColor = 'transparent'; g.lineWidth = 5; g.strokeStyle = CREAM; g.stroke();
  if (face) { g.imageSmoothingEnabled = false; g.drawImage(face, x + 20, y + 20, L.fs, L.fs); g.lineWidth = 4; g.strokeStyle = CREAM; g.strokeRect(x + 20, y + 20, L.fs, L.fs); g.imageSmoothingEnabled = true; }
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.font = `700 ${L.who}px ${FRED}`; g.fillStyle = GOLD; g.fillText(who, tx, y + L.head);
  const ww = g.measureText(who).width;
  g.font = `700 ${L.sub}px ${NUN}`; g.fillStyle = '#b8b2a0'; g.fillText(sub, tx + ww + 16, y + L.head);
  g.font = `800 ${L.txt}px ${NUN}`; g.fillStyle = '#f4f0e4';
  const shown = typed(text, t, t0 + 0.1, 55);
  wrap(shown, tx, y + L.body, x + w - 34 - tx, L.lh);
  g.restore();
}
function round(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '', yy = y;
  for (const wd of words) { const tryL = line ? line + ' ' + wd : wd; if (g.measureText(tryL).width > maxW && line) { g.fillText(line, x, yy); line = wd; yy += lh; } else line = tryL; }
  if (line) g.fillText(line, x, yy);
}
/** A caption in a letterbox bar: a small typed label, as if from a case file. */
function tag(t, t0, lines, y, { color = '#c8c4bc', size = 20, align = 'center', x = W / 2, cps = 60 } = {}) {
  let tt = t0;
  lines.forEach((ln, i) => {
    const txt = typed(ln.text, t, tt, cps);
    pix(txt, x, y + i * (size * 1.9), ln.size || size, { color: ln.color || color, align, shadow: false, outline: false, spacing: 2 });
    tt += ln.text.length / cps + 0.05;
  });
}

// ---------------- 1. the register (0.0 - 1.6) ----------------
const ROWS = [
  ['412', 'March 3rd', 'Martha', 'William & Harriet', 'Ashworth', 'Pemberton', 'Collier'],
  ['413', 'March 10th', 'John Hugh', 'Samuel & Ann', 'Whiteley', 'Wigan', 'Weaver'],
  ['414', 'March 17th', 'Sarah', 'Thomas & Mary', 'Garside', 'Wigan', 'Labourer'],
  ['415', 'March 24th', 'William', 'Daniel & Elizabeth', 'Ashworth', 'Pemberton', 'Miner'],
];
const COLS = [90, 250, 560, 880, 1270, 1580, 1890];
const ERASE = [0.45, 0.85, 1.25, 1.42];   // when each row is rubbed out (the scratches in the music)
let paper = null, rowInk = [];
function makePaper() {
  paper = document.createElement('canvas'); paper.width = 2200; paper.height = 1300;
  const p = paper.getContext('2d');
  const bg = p.createRadialGradient(1100, 600, 200, 1100, 650, 1300);
  bg.addColorStop(0, '#efe3c2'); bg.addColorStop(0.7, '#dcc89c'); bg.addColorStop(1, '#a8885a');
  p.fillStyle = bg; p.fillRect(0, 0, 2200, 1300);
  for (let i = 0; i < 9000; i++) { p.fillStyle = `rgba(${90 + hash(i) * 60},${60 + hash(i + 1) * 40},20,${hash(i + 2) * 0.08})`; p.fillRect(hash(i + 3) * 2200, hash(i + 4) * 1300, 1 + hash(i + 5) * 5, 1 + hash(i + 6) * 5); }
  for (let i = 0; i < 26; i++) { p.fillStyle = `rgba(120,80,30,${0.03 + hash(i * 9) * 0.05})`; p.beginPath(); p.arc(hash(i * 3) * 2200, hash(i * 5) * 1300, 30 + hash(i * 7) * 160, 0, 7); p.fill(); }
  p.fillStyle = '#3a2a1c'; p.textAlign = 'center';
  p.font = `64px ${FELLSC}`; p.fillText('Baptisms', 1100, 150);
  p.font = `italic 34px ${FELL}`; p.fillText('solemnized in the Parish of Wigan, in the County of Lancaster, in the Year 1844', 1100, 210);
  p.strokeStyle = 'rgba(70,40,20,0.55)'; p.lineWidth = 2;
  for (let r = 0; r <= 5; r++) { p.beginPath(); p.moveTo(60, 300 + r * 200); p.lineTo(2140, 300 + r * 200); p.stroke(); }
  for (const x of [220, 520, 830, 1230, 1540, 1850]) { p.beginPath(); p.moveTo(x, 250); p.lineTo(x, 1260); p.stroke(); }
  p.font = `22px ${FELLSC}`; p.fillStyle = '#5a4030';
  ['No.', 'When Baptized', "Child's Christian Name", 'Parents’ Christian Names', 'Surname', 'Abode', 'Trade'].forEach((h, i) => p.fillText(h, i === 0 ? 140 : [0, 370, 675, 1030, 1385, 1695, 1995][i], 280));
  // each row's ink on its own sheet, so it can be rubbed out
  rowInk = ROWS.map((row, r) => {
    const c = document.createElement('canvas'); c.width = 2200; c.height = 200;
    const x = c.getContext('2d'); x.fillStyle = '#1e1410'; x.textAlign = 'center'; x.textBaseline = 'middle';
    row.forEach((cell, i) => {
      x.font = i === 2 || i === 4 ? `italic 56px ${FELL}` : `italic 40px ${FELL}`;
      x.save(); x.translate(i === 0 ? 140 : [0, 370, 675, 1030, 1385, 1695, 1995][i], 100 + (hash(r * 7 + i) - 0.5) * 10); x.rotate((hash(r * 3 + i) - 0.5) * 0.04); x.fillText(cell, 0, 0); x.restore();
    });
    return c;
  });
}
function drawHook(t, f) {
  if (!paper) makePaper();
  g.fillStyle = '#120c08'; g.fillRect(0, 0, W, H);
  // tall: closer in, on the middle columns (the child's name, the parents, the surname)
  const z = (V ? 1.16 : 0.92) + 0.07 * t, flick = 0.94 + 0.06 * Math.sin(t * 31) * Math.sin(t * 17);
  g.save(); g.translate(W / 2, H / 2 + 20); g.rotate(V ? -0.04 : -0.025); g.scale(z, z); g.translate(V ? -1030 : -1100, V ? -680 : -700);
  g.filter = `brightness(${flick}) saturate(0.85)`;
  g.drawImage(paper, 0, 0);
  g.filter = 'none';
  ROWS.forEach((row, r) => {
    const y = 300 + r * 200, te = ERASE[r], k = span(t, te, te + 0.32);
    const xk = 60 + k * 2080;
    // ink still to the right of the rubber
    g.save(); g.beginPath(); g.rect(xk, y, 2200 - xk, 200); g.clip(); g.drawImage(rowInk[r], 0, y); g.restore();
    if (k > 0) {
      // where it has been: a grey smear, and a ghost of the name going
      g.save(); g.beginPath(); g.rect(0, y, xk, 200); g.clip();
      g.globalAlpha = 0.18 * (1 - span(t, te + 0.3, te + 0.8)); g.filter = 'blur(6px) grayscale(1)'; g.drawImage(rowInk[r], 0, y); g.filter = 'none';
      g.globalAlpha = 0.22; g.fillStyle = '#8a8478'; g.fillRect(60, y + 60, xk - 60, 80); g.restore();
      // grey dust thrown up by the rubber
      for (let q = 0; q < 70; q++) {
        const tb = te + (q / 70) * 0.32, age = t - tb; if (age < 0 || age > 0.9) continue;
        const px = 60 + (q / 70) * 2080 + age * (hash(q + r * 70) - 0.3) * 260, py = y + 100 + (hash(q * 3 + r) - 0.5) * 90 - age * (120 + hash(q * 5) * 260);
        g.globalAlpha = (1 - age / 0.9) * 0.7; g.fillStyle = q % 3 ? '#6a6660' : '#2a2420'; g.fillRect(px, py, 4 + hash(q * 9) * 7, 4 + hash(q * 9) * 7);
      }
      g.globalAlpha = 1;
      // the rubber itself
      if (k < 1) { g.save(); g.translate(xk, y + 100); g.rotate(-0.25); g.fillStyle = '#c84a5a'; g.fillRect(-40, -55, 80, 110); g.fillStyle = '#3a5aa8'; g.fillRect(-40, -55, 80, 46); g.restore(); }
    }
  });
  g.restore();
  // drained of colour as the names go
  const grey = span(t, 0.4, 1.5);
  g.save(); g.globalCompositeOperation = 'saturation'; g.fillStyle = `rgba(128,128,128,${grey})`; g.fillRect(0, 0, W, H); g.restore();
  vignette(0.85, '10,6,4');
  // the hook line
  const hookLine = typed('SOMEONE IS ERASING', t, 0.08, 34);
  if (V) {
    g.fillStyle = `rgba(8,6,10,${0.55 * span(t, 0.05, 0.3)})`; g.fillRect(0, 700, W, 480);
    pix(hookLine.slice(0, 10), W / 2, 800, 76, { color: '#f4f0e4' });
    pix(hookLine.slice(11), W / 2, 905, 76, { color: '#f4f0e4' });
    slam('YOUR FAMILY', W / 2, 1065, 86, t, 0.72, { color: GOLD });
  } else {
    g.fillStyle = `rgba(8,6,10,${0.55 * span(t, 0.05, 0.3)})`; g.fillRect(0, 380, W, 320);
    pix(hookLine, W / 2, 470, 64, { color: '#f4f0e4' });
    slam('YOUR FAMILY', W / 2, 600, 92, t, 0.72, { color: GOLD });
  }
  if (t > 1.42) tear(80 * span(t, 1.42, 1.6), f);
}

// ---------------- 2. Silas (1.6 - 5.0) ----------------
async function drawSilas(t, f) {
  const u = t - CUT.silas, im = await src('silas', u);
  const punch = ease.in(span(t, 4.45, 5.0));
  if (V) {
    portraitScene(im, { filter: `saturate(${0.5 - 0.3 * punch}) contrast(1.15) brightness(0.92)`, punch, shake: 14 * punch, t,
      split: 24 * punch + (u < 0.15 ? 30 * (1 - u / 0.15) : 0) });
    if (punch === 0) tag(t, 1.8, [{ text: 'HARGREAVES & LOWE', color: '#b8b8c0', size: 26 }, { text: 'PROBATE GENEALOGISTS', color: '#b8b8c0' }, { text: 'NO CALLERS. NO RELATIVES.', color: '#e05a5a' }], 185, { size: 20 });
    dialogueCard(t, 1.75, 4.5, 'Silas Hargreaves', 'Hargreaves & Lowe', 'Start the time engine. We are going to erase a family from history.', null);
    vignette(0.6);
    if (u < 0.12) tear(60 * (1 - u / 0.12), f + 7);
    if (punch > 0.4) tear(90 * punch, f);
    return;
  }
  shot(im, { zoom: lerp(1.02 + 0.06 * u / 3.4, 1.55, punch), cx: lerp(900, 250, punch), cy: lerp(1000, 540, punch), mask: true,
    filter: `saturate(${0.5 - 0.3 * punch}) contrast(1.15) brightness(0.92)`, split: 24 * punch + (u < 0.15 ? 30 * (1 - u / 0.15) : 0), shake: 10 * punch, t });
  if (punch === 0) tag(t, 1.8, [{ text: 'HARGREAVES & LOWE · PROBATE GENEALOGISTS', color: '#b8b8c0' }, { text: 'NO CALLERS. NO RELATIVES.', color: '#e05a5a', size: 16 }], 46);
  vignette(0.6);
  if (u < 0.12) tear(60 * (1 - u / 0.12), f + 7);
  if (punch > 0.4) tear(90 * punch, f);
}

// ---------------- 3. Dorothy (5.0 - 6.9) ----------------
async function drawDorothy(t, f) {
  const u = t - CUT.dorothy, im = await src('dorothy', u);
  if (V) {
    portraitScene(im, { filter: 'saturate(1.2) sepia(0.12) contrast(1.05)', shake: 26 * Math.max(0, 1 - u / 0.4), t });
    tag(t, 5.25, [{ text: 'DOROTHY PICKERING', color: GOLD, size: 26 }, { text: 'COUNTY ARCHIVIST, RETIRED', color: GOLD }, { text: '"I WAS A VERY BORED ARCHIVIST."', color: '#e8e0d0' }], 185, { size: 20 });
    dialogueCard(t, 5.12, 7.2, 'Dorothy Pickering', 'County Archivist, retired', 'Not while I\'m breathing, Silas Hargreaves.', null);   // runs to the cut
    vignette(0.45);
    flash(1 - u / 0.3);
    return;
  }
  shot(im, { zoom: 1.04 + 0.03 * u, cx: 900, cy: 1000, mask: true, filter: 'saturate(1.2) sepia(0.12) contrast(1.05)', shake: 26 * Math.max(0, 1 - u / 0.4), t });
  tag(t, 5.25, [{ text: 'DOROTHY PICKERING · COUNTY ARCHIVIST, RETIRED', color: GOLD }, { text: '"I WAS A VERY BORED ARCHIVIST."', color: '#e8e0d0', size: 16 }], 46);
  vignette(0.45);
  flash(1 - u / 0.3);
}

// ---------------- 4. the Heirloom (6.9 - 8.0) ----------------
async function drawHeirloom(t, f) {
  const u = t - CUT.heirloom, im = await src('heirloom', u, 0.5);
  const z = lerp(2.6, 2.2, ease.out(u / 1.1));
  shot(im, { zoom: z, cx: 960, cy: 510, filter: 'saturate(1.25) contrast(1.08)', rot: -0.04 + 0.03 * u, shake: 6 * span(t, 7.3, 8.0), t });
  vignette(0.6);
  // a reticle round the car and its name
  const k = ease.back(span(t, 7.0, 7.3)), a = span(t, 7.0, 7.15);
  g.save(); g.translate(W / 2, H / 2); g.globalAlpha = a; g.strokeStyle = GOLD; g.lineWidth = 6;
  const r = 150 * (1.6 - 0.6 * k);
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { g.beginPath(); g.moveTo(sx * r, sy * (r - 50)); g.lineTo(sx * r, sy * r); g.lineTo(sx * (r - 50), sy * r); g.stroke(); }
  g.restore();
  if (V) {   // tall: the name goes under the reticle instead of beside it
    if (t >= 7.12) pix('THE HEIRLOOM', W / 2, H / 2 + 300 + 60 * (1 - ease.out(span(t, 7.12, 7.3))), 66, { color: GOLD, alpha: span(t, 7.12, 7.22) });
    pix(typed('runs on register ink.', t, 7.35, 40), W / 2, H / 2 + 400, 30, { color: '#fff' });
    pix(typed('turns the years back.', t, 7.6, 40), W / 2, H / 2 + 455, 30, { color: '#fff' });
  } else {
    if (t >= 7.12) pix('THE HEIRLOOM', W / 2 + 230 + 60 * (1 - ease.out(span(t, 7.12, 7.3))), H / 2 - 60, 54, { color: GOLD, align: 'left', alpha: span(t, 7.12, 7.22) });
    pix(typed('runs on register ink.', t, 7.35, 40), W / 2 + 234, H / 2 + 20, 24, { color: '#fff', align: 'left' });
    pix(typed('turns the years back.', t, 7.6, 40), W / 2 + 234, H / 2 + 64, 24, { color: '#fff', align: 'left' });
  }
  if (t > 7.9) flash(span(t, 7.9, 8.0) * 0.9);
}

// ---------------- 5. the chase (8.0 - 12.0) and the finale (12.0 - 15.0) ----------------
async function drawChase(t, f) {
  const u = t - CUT.chase, im = await src('chase', u, 0.75);
  const beat = (t - 8) % 0.5, kick = Math.max(0, 1 - beat / 0.12);
  // tall: framed low enough that the game's tutorial toast (footage y < 310) stays off the top; the words go underneath
  shot(im, { zoom: 2.15 + 0.15 * u + 0.04 * kick, vzoom: 1.46 + 0.06 * u + 0.02 * kick, cx: 950, cy: V ? 690 : 590, filter: 'saturate(1.25) contrast(1.1)', shake: 10 * kick, t });
  vignette(0.5);
  flash(0.8 * Math.max(0, 1 - u / 0.2));
  const dy = V ? 1060 : 0;
  slam('GREY VANS', W / 2, 190 + dy, 84, t, 8.0, { color: '#d8d8e0', until: 8.95 });
  slam('ON YOUR TAIL', W / 2, 300 + dy, 64, t, 8.25, { color: '#fff', until: 8.95 });
  slam('RAM THEM', W / 2, 200 + dy, 96, t, 9.0, { color: GOLD, until: 9.6 });
}
async function drawJump(t, f) {
  const u = t - CUT.jump, im = await src('jump', u, 1);
  shot(im, { zoom: 1.32 + 0.3 * Math.sin(Math.PI * clamp(u / 1.5)), cx: 960, cy: 560, filter: 'saturate(1.2) contrast(1.1)', split: 30 * Math.sin(Math.PI * clamp(u / 1.5)), t });
  // speed lines into the centre
  const a = Math.sin(Math.PI * clamp(u / 1.5));
  g.save(); g.translate(W / 2, H / 2); g.strokeStyle = `rgba(255,255,255,${0.5 * a})`; g.lineWidth = 5;
  for (let i = 0; i < 48; i++) { const an = hash(i) * 7, r0 = 300 + ((hash(i * 3) + u * 3) % 1) * (V ? 1300 : 900); g.beginPath(); g.moveTo(Math.cos(an) * r0, Math.sin(an) * r0); g.lineTo(Math.cos(an) * (r0 + 220), Math.sin(an) * (r0 + 220)); g.stroke(); }
  g.restore();
  vignette(0.5);
  const dy = V ? 200 : 0;
  if (u > 1.4) { g.fillStyle = `rgba(8,6,10,${0.45 * span(u, 1.4, 1.6)})`; g.fillRect(0, 70 + dy, W, 240); }
  slam('4 CENTURIES', W / 2, 150 + dy, V ? 84 : 96, t, CUT.jump + 1.45, { color: GOLD, until: CUT.finale });
  slam('1 VERY OLD CAR', W / 2, 255 + dy, V ? 56 : 60, t, CUT.jump + 1.75, { color: '#fff', until: CUT.finale });
}
let face = null;
async function drawFinale(t, f) {
  const u = t - CUT.finale, im = await src('finale', u, 1.7);
  if (!face) {
    const p = await frame(SRC.portrait.clip, SRC.portrait.at);
    face = document.createElement('canvas'); face.width = face.height = 400;
    if (p) face.getContext('2d').drawImage(p, 22, 290, 450, 450, 0, 0, 400, 400);
  }
  const beat = (t - 8) % 0.5, kick = Math.max(0, 1 - beat / 0.12), out = span(t, 14.3, 15.0);
  shot(im, { zoom: 1.3 + 0.025 * kick + 0.4 * ease.in(out), vzoom: 1.03 + 0.02 * kick + 0.4 * ease.in(out), cx: 960, cy: 560, filter: `saturate(1.2) contrast(1.1)`, shake: 8 * kick + 30 * out, split: 40 * out, t });
  vignette(0.55);
  // tall: a dark band for the year stamps, over the game's own "has jumped to..." toast
  // and a fade over the top strip, where the game's mission line is cut off at the sides
  if (V) {
    g.fillStyle = `rgba(8,6,10,${1 - out})`; g.fillRect(0, 315, W, 190);
    const top = g.createLinearGradient(0, 150, 0, 240); top.addColorStop(0, `rgba(8,6,10,${0.95 * (1 - out)})`); top.addColorStop(1, 'rgba(8,6,10,0)');
    g.fillStyle = `rgba(8,6,10,${0.95 * (1 - out)})`; g.fillRect(0, 0, W, 150); g.fillStyle = top; g.fillRect(0, 150, W, 90);
  }
  flash(0.85 * Math.max(0, 1 - u / 0.18));
  dialogueCard(t, 12.25, 14.35, 'Silas Hargreaves', 'Hargreaves & Lowe', 'You have thousands of them! I only ever wanted one!', face);
  // each hop through the centuries gets a year stamp in the corner, as the game itself jumps
  const hops = [[12.59, '1937'], [12.98, '2026'], [13.75, '1989'], [14.14, '1791']];
  hops.forEach(([at, yr], i) => {
    const until = Math.min(at + 0.6, hops[i + 1] ? hops[i + 1][0] : 14.85);   // gone before the next hop lands
    if (t < at || t >= until) return;
    const k = span(t, at, at + 0.12);
    pix(yr, V ? W / 2 : W - 60, V ? 412 : 230, V ? 140 : 120, { color: GOLD, align: V ? 'center' : 'right', scale: lerp(1.6, 1, ease.out(k)), alpha: k * (1 - span(t, until - 0.12, until)) });
  });
  if (out > 0) tear(70 * out, f);
  flash(ease.in(span(t, 14.82, 15.0)));
}

// ---------------- 6. the title and the call (15.0 - 20.0) ----------------
const NAMES = ['Jess', 'John', 'Sarah', 'Daniel', 'Catherine', 'William', 'Martha', 'Samuel', 'Harriet', 'Elizabeth', 'Thomas', 'Mary', 'Robert', 'Ann', 'James'];
function drawTitle(t, f) {
  const u = t - CUT.title;
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0b080c'); bg.addColorStop(1, PLUM);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // stars
  for (let i = 0; i < 160; i++) { const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * (1 + hash(i) * 3) + i)); g.fillStyle = `rgba(255,248,220,${0.5 * tw * hash(i * 7)})`; g.fillRect(hash(i * 3) * W, hash(i * 5) * H, 2 + (hash(i) > 0.9 ? 2 : 0), 2 + (hash(i) > 0.9 ? 2 : 0)); }
  // a pedigree fanning out from you, a generation at a time, lighting up with the bells
  // (on the tall screen the fan is narrower and taller, behind the button)
  const ox = W / 2, oy = H + 40, gens = 6, R0 = V ? 110 : 140, STEP = V ? 92 : 155, YS = V ? 1.45 : 0.92;
  g.save(); g.lineCap = 'round';
  let idx = 0;
  for (let gen = 0; gen < gens; gen++) {
    const n = 2 ** gen, R = R0 + gen * STEP, grow = ease.out(span(u, 0.1 + gen * 0.32, 0.5 + gen * 0.32));
    for (let i = 0; i < n; i++, idx++) {
      const an = Math.PI + (i + 0.5) / n * Math.PI, x = ox + Math.cos(an) * R, y = oy + Math.sin(an) * R * YS;
      if (gen > 0) {
        const pi = Math.floor(i / 2), pn = n / 2, pan = Math.PI + (pi + 0.5) / pn * Math.PI, pR = R - STEP, px = ox + Math.cos(pan) * pR, py = oy + Math.sin(pan) * pR * YS;
        g.strokeStyle = i % 2 ? 'rgba(240,138,160,0.55)' : 'rgba(138,180,255,0.55)'; g.lineWidth = 3;
        g.beginPath(); g.moveTo(px, py); g.lineTo(lerp(px, x, grow), lerp(py, y, grow)); g.stroke();
      }
      if (grow > 0.95 || gen === 0) {
        const glow = 0.6 + 0.4 * Math.sin(t * 3 + idx);
        g.fillStyle = `rgba(255,216,74,${0.25 * glow})`; g.beginPath(); g.arc(x, y, 16, 0, 7); g.fill();
        g.fillStyle = GOLD; g.beginPath(); g.arc(x, y, gen < 3 ? 7 : 5, 0, 7); g.fill();
        if (gen < 4 && gen > 0) { g.font = `700 ${gen < 2 ? 22 : 17}px ${FRED}`; g.fillStyle = 'rgba(244,240,228,0.55)'; g.textAlign = 'center'; g.fillText(NAMES[idx % NAMES.length], x, y - 18); }
      }
    }
  }
  g.restore();
  g.fillStyle = 'rgba(11,8,12,0.45)'; g.fillRect(0, 0, W, H);
  // the title
  const k = span(u, 0, 0.22), shake = Math.max(0, 1 - u / 0.4) * 22;
  g.save(); g.translate((hash(f) - 0.5) * shake, (hash(f + 9) - 0.5) * shake);
  const TY = V ? 560 : 300, TS = V ? 120 : 150;
  if (u >= 0) {
    const sc = lerp(2.2, 1, ease.out(k));
    for (let d = 10; d > 0; d -= 2) pix('ANCESTRY', W / 2 + d, TY + d, TS, { color: GOLD_DK, shadow: false, scale: sc, alpha: k });
    pix('ANCESTRY', W / 2, TY, TS, { color: GOLD, shadow: false, scale: sc, alpha: k });
  }
  const sub = 'A BATTLE IN TIME';
  pix(sub.slice(0, Math.floor(span(u, 0.35, 0.95) * sub.length + 0.001)), W / 2, V ? 695 : 455, V ? 54 : 56, { color: '#fff' });
  g.restore();
  if (V) { titleCallTall(t, u); vignette(0.5); flash(Math.max(0, 1 - u / 0.35)); if (u > 4.75) { g.fillStyle = `rgba(0,0,0,${span(u, 4.75, 5.0) * 0.3})`; g.fillRect(0, 0, W, H); } return; }
  // save the ______ family
  const sur = ['ASHWORTH', 'GARSIDE', 'WHITELEY', 'BRENNAN', 'VICKERS', 'HOLROYD'];
  if (u > 1.5) {
    const a = span(u, 1.5, 1.7);
    const rollEnd = 2.85, ri = Math.floor((u - 1.6) / 0.2);
    let word = u < rollEnd ? sur[Math.max(0, ri) % sur.length] : '';
    g.font = `44px ${PIX}`;
    const left = 'SAVE THE ', right = ' FAMILY', slotW = 470;
    const total = g.measureText(left).width + slotW + g.measureText(right).width, x0 = W / 2 - total / 2, y = 640;
    pix(left, x0, y, 44, { align: 'left', alpha: a });
    const sx = x0 + g.measureText(left).width;
    g.fillStyle = `rgba(255,216,74,${0.14 * a})`; g.fillRect(sx, y - 42, slotW, 84);
    g.fillStyle = GOLD; g.globalAlpha = a; g.fillRect(sx + 10, y + 34, slotW - 20, 6); g.globalAlpha = 1;
    if (word) pix(word, sx + slotW / 2, y + 2 - 40 * ((u - 1.6) % 0.2) / 0.2 * 0, 44, { color: GOLD, alpha: a });
    else if (Math.floor(u * 2.5) % 2 === 0) { g.fillStyle = GOLD; g.fillRect(sx + slotW / 2 - 16, y - 26, 32, 52); }
    pix(right, sx + slotW, y, 44, { align: 'left', alpha: a });
    if (u > rollEnd) pix(typed('your surname goes here', t, CUT.title + rollEnd, 45), W / 2, 712, 18, { color: '#b8b2a0', shadow: false, outline: false });
  }
  // the call
  if (u > 3.1) {
    const k2 = ease.back(span(u, 3.1, 3.4)), bw = 900, bh = 110, bx = W / 2 - bw / 2, by = 800 + (1 - k2) * 40;
    g.save(); g.globalAlpha = span(u, 3.1, 3.25);
    g.fillStyle = GOLD_DK; round(bx, by + 10, bw, bh, 55); g.fill();
    g.fillStyle = GOLD; round(bx, by, bw, bh, 55); g.fill();
    g.font = `700 50px ${FRED}`; g.fillStyle = '#1a1a1a'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('Load your family tree  ▶', W / 2, by + bh / 2 + 2);
    g.restore();
    g.font = `700 26px ${NUN}`; g.textAlign = 'center'; g.fillStyle = `rgba(232,224,208,${span(u, 3.5, 3.8)})`;
    g.fillText('Plays in your browser  ·  your GEDCOM never leaves your device', W / 2, 980);
  }
  vignette(0.5);
  flash(Math.max(0, 1 - u / 0.35));
  if (u > 4.75) { g.fillStyle = `rgba(0,0,0,${span(u, 4.75, 5.0) * 0.3})`; g.fillRect(0, 0, W, H); }
}

/** The tall screen's "save the ______ family" and the button: the same beats, stacked. */
function titleCallTall(t, u) {
  const sur = ['ASHWORTH', 'GARSIDE', 'WHITELEY', 'BRENNAN', 'VICKERS', 'HOLROYD'];
  if (u > 1.5) {
    const a = span(u, 1.5, 1.7), rollEnd = 2.85, ri = Math.floor((u - 1.6) / 0.2);
    const word = u < rollEnd ? sur[Math.max(0, ri) % sur.length] : '';
    const slotW = 560, y = 985, sx = W / 2 - slotW / 2;
    pix('SAVE THE', W / 2, 875, 52, { alpha: a });
    g.fillStyle = `rgba(255,216,74,${0.14 * a})`; g.fillRect(sx, y - 48, slotW, 96);
    g.fillStyle = GOLD; g.globalAlpha = a; g.fillRect(sx + 10, y + 40, slotW - 20, 7); g.globalAlpha = 1;
    if (word) pix(word, W / 2, y + 2, 52, { color: GOLD, alpha: a });
    else if (Math.floor(u * 2.5) % 2 === 0) { g.fillStyle = GOLD; g.fillRect(W / 2 - 18, y - 30, 36, 60); }
    pix('FAMILY', W / 2, 1100, 52, { alpha: a });
    if (u > rollEnd) pix(typed('your surname goes here', t, CUT.title + rollEnd, 45), W / 2, 1170, 22, { color: '#b8b2a0', shadow: false, outline: false });
  }
  if (u > 3.1) {
    const k2 = ease.back(span(u, 3.1, 3.4)), bw = 940, bh = 124, bx = W / 2 - bw / 2, by = 1255 + (1 - k2) * 40;
    g.save(); g.globalAlpha = span(u, 3.1, 3.25);
    g.fillStyle = GOLD_DK; round(bx, by + 10, bw, bh, 62); g.fill();
    g.fillStyle = GOLD; round(bx, by, bw, bh, 62); g.fill();
    g.font = `700 54px ${FRED}`; g.fillStyle = '#1a1a1a'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('Load your family tree  ▶', W / 2, by + bh / 2 + 2);
    g.restore();
    g.font = `700 32px ${NUN}`; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = `rgba(232,224,208,${span(u, 3.5, 3.8)})`;
    g.fillText('Plays in your browser', W / 2, 1460);
    g.fillText('Your GEDCOM never leaves your device', W / 2, 1504);
  }
}

// ---------------- one frame ----------------
window.renderFrame = async n => {
  const t = n / FPS;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  if (t < CUT.silas) drawHook(t, n);
  else if (t < CUT.dorothy) await drawSilas(t, n);
  else if (t < CUT.heirloom) await drawDorothy(t, n);
  else if (t < CUT.chase) await drawHeirloom(t, n);
  else if (t < CUT.jump) await drawChase(t, n);
  else if (t < CUT.finale) await drawJump(t, n);
  else if (t < CUT.title) await drawFinale(t, n);
  else drawTitle(t, n);
  grain(n, t < CUT.silas ? 0.12 : 0.06);
  return true;
};
window.ready = document.fonts.ready.then(() => Promise.all(['64px "Press Start 2P"', '40px "IM Fell English"', 'italic 40px "IM Fell English"', '40px "IM Fell English SC"', '700 40px Fredoka', '800 40px Nunito', '700 40px Nunito'].map(f => document.fonts.load(f))));
